# XcodeGen spec: `brew install xcodegen && xcodegen` regenerates LastbookRemote.xcodeproj.
name: LastbookRemote
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  LastbookRemoteKit:
    path: LastbookRemoteKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LastbookRemote:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: LastbookRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LASTBOOK_BUNDLE_ID_PREFIX).lastbookremote
        PRODUCT_NAME: LastbookRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lastbook Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Lastbook Remote connects to the Lastbook library shared by a computer on your network.
        # Lastbook's share listener is plain HTTP. NSAllowsLocalNetworking alone does not cover
        # Tailscale's 100.64.0.0/10 addresses, and NSAllowsArbitraryLoads is ignored when any narrower
        # key sits beside it, so it stands alone. The app itself refuses public internet addresses
        # (HostAddress.isAllowed). Drop this once Lastbook serves HTTPS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    scheme:
      gatherCoverageData: false
